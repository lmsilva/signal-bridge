# One-off Tesla OAuth on the NAS (host networking).
# ./tesla-auth.sh sets TESLA_OAUTH_REDIRECT_URI for NAS-hosted OAuth.
# Phone/control-page auth uses https://<NAS_LAN_IP>:4381/callback (see .env TESLA_REDIRECT_URI).
# PC browser auth normally uses http://localhost:4381/callback via npm run tesla-auth.
services:
  alexa-broadcast-tesla-auth:
    image: alexa-broadcast-bridge:latest
    container_name: alexa-broadcast-tesla-auth
    network_mode: host
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_FLEET_DOMAIN: ${TESLA_FLEET_DOMAIN:-}
      TESLA_FLEET_REGION: ${TESLA_FLEET_REGION:-na}
      TESLA_VIN: ${TESLA_VIN:-}
      TESLA_OAUTH_REDIRECT_URI: ${TESLA_OAUTH_REDIRECT_URI:?Set TESLA_OAUTH_REDIRECT_URI via ./tesla-auth.sh}
      TESLA_REDIRECT_URI: ""
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
    command: ["node", "src/tesla-auth.js"]
