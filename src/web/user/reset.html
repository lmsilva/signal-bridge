<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Reset password — Signal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/landing.css">
</head>
<body>
  <div class="ln-shell">
    <header class="ln-hero">
      <h1 class="ln-title">New password</h1>
      <p class="ln-tagline">Choose a password for your Signal account.</p>
    </header>
    <form class="ln-login-card" id="reset-form" style="max-width:420px;margin:0 auto">
      <p class="ln-login-error" id="reset-error" role="alert"></p>
      <label class="ln-label" for="reset-password">New password</label>
      <input id="reset-password" class="ln-input" type="password" autocomplete="new-password" minlength="8" required>
      <button class="ln-submit" type="submit">Save password</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    document.getElementById('reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById('reset-error');
      errorEl.textContent = '';
      try {
        const response = await fetch('/api/user/reset', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            password: document.getElementById('reset-password').value,
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not reset that password');
        location.href = '/';
      } catch (error) {
        errorEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
