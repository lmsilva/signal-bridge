<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Signal Photos">
  <title>Signal — Share a photo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="booth.css?v=1">
</head>
<body>
  <header class="booth-header">
    <img class="booth-logo" src="/logo.png" width="36" height="36" alt="">
    <div>
      <h1>Signal</h1>
      <p>Share a photo with us</p>
    </div>
  </header>

  <main class="booth-main">
    <label class="booth-label" for="display-select">Show on</label>
    <select id="display-select" class="booth-select" aria-label="Target display">
      <option value="">Looking for displays…</option>
    </select>
    <p class="booth-hint" id="display-hint">Pick a display, or send to all of them.</p>

    <div class="booth-preview" id="photo-preview" hidden>
      <img id="photo-preview-img" alt="Selected photo preview">
      <button type="button" class="booth-clear" id="btn-photo-clear" aria-label="Clear photo">×</button>
    </div>

    <input id="photo-file" type="file" accept="image/*" capture="environment" hidden>

    <button type="button" class="booth-pick" id="btn-pick-photo">
      <span class="booth-pick-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
      </span>
      <span>Take or choose a photo</span>
    </button>

    <button type="button" class="booth-send" id="btn-send" disabled>Send to display</button>
    <p class="booth-status" id="booth-status" role="status"></p>
  </main>

  <footer class="booth-footer">
    Photos are saved to the party slideshow for the host.
  </footer>

  <script src="booth.js?v=1"></script>
</body>
</html>
