<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Signal">
  <meta name="description" content="Games, photos and the guest book for the house board.">
  <title>Signal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="landing.css?v=1">
</head>
<body>
  <div class="ln-shell">
    <header class="ln-hero">
      <img class="ln-logo" src="/logo.svg" width="88" height="88" alt=""
           onerror="this.onerror=null;this.src='/logo.png'">
      <h1 class="ln-title">Signal</h1>
      <p class="ln-tagline">Everything on the board, from your phone.</p>
    </header>

    <nav class="ln-grid" aria-label="Where to go">
      <a class="ln-tile ln-tile-games" href="/games/">
        <span class="ln-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="6.5" width="19" height="11" rx="4"></rect>
            <path d="M7 10v4M5 12h4M15.5 11h.01M18 13.5h.01"></path>
          </svg>
        </span>
        <span class="ln-label">Games</span>
        <span class="ln-note">Join Word Scramble with the board's code</span>
      </a>

      <a class="ln-tile ln-tile-snaps" href="/guestsnaps/">
        <span class="ln-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h6.2l1.2 2h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path>
            <circle cx="12" cy="12" r="3.4"></circle>
          </svg>
        </span>
        <span class="ln-label">Guest Snaps</span>
        <span class="ln-note">Put a photo up on the screen</span>
      </a>

      <a class="ln-tile ln-tile-book" href="/guestbook/" id="ln-guestbook" hidden>
        <span class="ln-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5.5A1.5 1.5 0 0 1 4 19.5z"></path>
            <path d="M8 8h8M8 12h8M8 16h5"></path>
          </svg>
        </span>
        <span class="ln-label">Guest Book</span>
        <span class="ln-note">Leave a message for the wall</span>
      </a>

      <a class="ln-tile ln-tile-admin" href="/admin/">
        <span class="ln-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
            <circle cx="9" cy="6" r="2"></circle>
            <circle cx="15" cy="12" r="2"></circle>
            <circle cx="8" cy="18" r="2"></circle>
          </svg>
        </span>
        <span class="ln-label">Admin</span>
        <span class="ln-note">Settings, pushes and the board</span>
      </a>
    </nav>
  </div>

  <script>
    // The guest book is only a destination when the house has it switched on.
    fetch('/api/guestbook/status', { credentials: 'same-origin' })
      .then((response) => response.json())
      .then((data) => {
        if (data && data.enabled) document.getElementById('ln-guestbook').hidden = false;
      })
      .catch(() => {});
  </script>
</body>
</html>
