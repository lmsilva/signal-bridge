<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Signal Bridge — Admin login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="styles.css?v=signal202">
  <style>
    .login-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .login-card {
      width: min(100%, 400px);
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px 22px 22px;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .login-brand img { width: 36px; height: 36px; border-radius: 8px; }
    .login-brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
    }
    #login-hint { margin-top: 0; margin-bottom: 18px; }
    .login-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: 0 0 12px;
      min-height: 1.2em;
    }
    .login-card .field-input { margin-bottom: 14px; }
    /* .field-input sets outline:none, so focus needs a ring of its own. */
    .login-card .field-input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.28);
    }
    .login-note {
      margin: 18px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .login-note-label {
      display: block;
      margin: 0 0 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .login-note-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
    }
    /* One colour in every state, visited included. Left to the browser these
       fall back to the 1994 blue-then-purple defaults, which reads as broken
       styling rather than as useful history. Hover carries the affordance. */
    .login-note-links a,
    .login-note-links a:visited {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
    }
    .login-note-links a:hover,
    .login-note-links a:focus-visible {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .login-note-links a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .login-note-links a:active { color: var(--accent-press); }
  </style>
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="login-brand">
        <img src="/logo.png" width="36" height="36" alt="">
        <h1>Signal Admin</h1>
      </div>
      <p class="hint" id="login-hint">Enter the admin password.</p>
      <p class="login-error" id="login-error" role="alert"></p>
      <label class="field-label" for="admin-password">Password</label>
      <input
        id="admin-password"
        class="field-input"
        type="password"
        name="password"
        autocomplete="current-password"
        required
        autofocus
      >
      <button class="btn btn-accent btn-block" type="submit" id="login-submit">Sign in</button>
      <div class="login-note">
        <span class="login-note-label">Guests</span>
        <div class="login-note-links">
          <a href="/">Home</a>
          <a href="/guestsnaps/">Photo booth</a>
          <a href="/games/">Games</a>
          <span id="guest-book-quicklink" hidden><a href="/guestbook/">Guest book</a></span>
        </div>
      </div>
    </form>
  </div>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const input = document.getElementById('admin-password');
      const errorEl = document.getElementById('login-error');
      const hintEl = document.getElementById('login-hint');
      const submit = document.getElementById('login-submit');
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/admin/';

      fetch('/api/guestbook/status', { credentials: 'same-origin' })
        .then((response) => response.json().catch(() => ({})))
        .then((data) => {
          const link = document.getElementById('guest-book-quicklink');
          if (link && data && data.enabled) {
            link.hidden = false;
          }
        })
        .catch(() => {});

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.textContent = '';
        submit.disabled = true;
        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (data.code === 'admin_password_unset') {
              hintEl.textContent = 'Set ADMIN_PASSWORD in the bridge .env file and restart the container, then try again.';
            }
            if (data.code === 'rate_limited' && data.retryAfterSec > 0) {
              throw new Error(
                data.error || `Too many failed logins — wait ${data.retryAfterSec}s and try again.`,
              );
            }
            throw new Error(data.error || 'Login failed');
          }
          try {
            localStorage.removeItem('signal.pushView');
          } catch {
            // Private mode — admin still opens on Home.
          }
          location.href = next.startsWith('/admin') ? next : '/admin/';
        } catch (error) {
          errorEl.textContent = error.message || 'Login failed';
          input.focus();
          input.select();
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
