<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Signal Bridge — Admin login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="styles.css?v=signal202">
  <style>
    .login-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .login-card {
      width: min(100%, 400px);
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px 22px 22px;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .login-brand img { width: 36px; height: 36px; border-radius: 8px; }
    .login-brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
    }
    #login-hint { margin-top: 0; margin-bottom: 18px; }
    .login-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: 0 0 12px;
      min-height: 1.2em;
    }
    .login-card .field-input { margin-bottom: 14px; }
    /* .field-input sets outline:none, so focus needs a ring of its own. */
    .login-card .field-input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.28);
    }
    .login-home {
      display: block;
      margin: 16px 0 0;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }
    .login-home:visited { color: var(--text-dim); }
    .login-home:hover,
    .login-home:focus-visible {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .login-home:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="login-brand">
        <img src="/logo.png" width="36" height="36" alt="">
        <h1>Signal Admin</h1>
      </div>
      <p class="hint" id="login-hint">Sign in with the household admin username and password.</p>
      <p class="login-error" id="login-error" role="alert"></p>
      <label class="field-label" for="admin-username">Username</label>
      <input
        id="admin-username"
        class="field-input"
        type="text"
        name="username"
        autocomplete="username"
        spellcheck="false"
        autofocus
        placeholder="admin"
      >
      <label class="field-label" for="admin-password">Password</label>
      <input
        id="admin-password"
        class="field-input"
        type="password"
        name="password"
        autocomplete="current-password"
        required
      >
      <button class="btn btn-accent btn-block" type="submit" id="login-submit">Sign in</button>
      <a class="login-home" href="/" id="btn-signal-home">Back to Signal</a>
    </form>
  </div>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const username = document.getElementById('admin-username');
      const input = document.getElementById('admin-password');
      const errorEl = document.getElementById('login-error');
      const hintEl = document.getElementById('login-hint');
      const submit = document.getElementById('login-submit');
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/admin/';

      fetch('/api/admin/session', { credentials: 'same-origin' })
        .then((response) => response.json().catch(() => ({})))
        .then((data) => {
          if (data && data.adminUsername && username && !username.value) {
            username.placeholder = data.adminUsername;
          }
        })
        .catch(() => {});

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.textContent = '';
        submit.disabled = true;
        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: username.value.trim() || 'admin',
              password: input.value,
              requireAdmin: true,
            }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (data.code === 'admin_password_unset') {
              hintEl.textContent = 'Set ADMIN_PASSWORD in the bridge .env file and restart the container, then try again.';
            }
            if (data.code === 'rate_limited' && data.retryAfterSec > 0) {
              throw new Error(
                data.error || `Too many failed logins — wait ${data.retryAfterSec}s and try again.`,
              );
            }
            throw new Error(data.error || 'Login failed');
          }
          try {
            localStorage.removeItem('signal.pushView');
          } catch {
            // Private mode — admin still opens on Home.
          }
          location.href = next.startsWith('/admin') ? next : '/admin/';
        } catch (error) {
          errorEl.textContent = error.message || 'Login failed';
          input.focus();
          input.select();
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
