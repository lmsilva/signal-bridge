<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#070f22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Games">
  <title>Word Scramble</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="games.css?v=7">
</head>
<body>
  <div class="gm-shell">
    <header class="gm-header">
      <img class="gm-logo" src="/logo.png" width="40" height="40" alt="">
      <div class="gm-headings">
        <h1 id="gm-title">Word Scramble</h1>
        <p id="gm-subtitle">Join with the code on the board</p>
      </div>
    </header>

    <main class="gm-join" id="gm-join">
      <div class="gm-card gm-join-card">
        <label class="gm-label" for="gm-code">Game code</label>
        <input id="gm-code" class="gm-input gm-input-code" type="text" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="SLNG">
        <label class="gm-label" for="gm-name">First name</label>
        <input id="gm-name" class="gm-input" type="text" maxlength="10" autocomplete="given-name" autocapitalize="words" spellcheck="false">
        <p class="gm-status" id="gm-join-status" role="status"></p>
        <button type="button" class="gm-send" id="btn-gm-join">Join</button>
      </div>
    </main>

    <main class="gm-play" id="gm-play" hidden>
      <section class="gm-stage">
        <div class="gm-meta">
          <div class="gm-meta-main">
            <p class="gm-phase" id="gm-phase">Waiting</p>
            <p class="gm-score" id="gm-score"></p>
          </div>
          <p class="gm-timer" id="gm-timer"></p>
        </div>

        <p class="gm-code-line" id="gm-code-line" hidden></p>

        <div class="gm-board-wrap">
          <div class="gm-grid" id="gm-grid" hidden></div>
        </div>

        <form class="gm-compose" id="gm-word-form" hidden>
          <label class="gm-label gm-sr-only" for="gm-word">Word</label>
          <div class="gm-compose-row">
            <input id="gm-word" class="gm-input" type="text" name="gm-word" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" inputmode="text" placeholder="Tap the letters or type">
            <button type="button" class="gm-clear" id="btn-gm-clear" aria-label="Clear the word" hidden>&#x2715;</button>
            <button type="submit" class="gm-send gm-send-inline">Submit</button>
          </div>
        </form>

        <p class="gm-status" id="gm-play-status" role="status"></p>
      </section>

      <aside class="gm-side">
        <section class="gm-card gm-section" id="gm-found-section" hidden>
          <h2 class="gm-h2" id="gm-found-title">Your words</h2>
          <ul class="gm-chips" id="gm-found"></ul>
        </section>

        <section class="gm-card gm-section" id="gm-recap-section" hidden>
          <h2 class="gm-h2" id="gm-recap-title">Words found</h2>
          <ul class="gm-chips" id="gm-recap"></ul>
        </section>

        <section class="gm-card gm-section">
          <h2 class="gm-h2" id="gm-list-title">Players</h2>
          <ol class="gm-board" id="gm-list"></ol>
        </section>

        <button type="button" class="gm-secondary" id="btn-gm-leave">Leave</button>
      </aside>
    </main>
  </div>

  <script src="games.js?v=7"></script>
  <script src="scramble.js?v=8"></script>
</body>
</html>
