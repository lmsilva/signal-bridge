services:
  signal-bridge:
    build: .
    image: signal-bridge:latest
    container_name: signal-bridge
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      AMAZON_PAGE: ${AMAZON_PAGE:-amazon.com}
      ACCEPT_LANGUAGE: ${ACCEPT_LANGUAGE:-en-US}
      DEBUG: ${DEBUG:-0}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_FLEET_DOMAIN: ${TESLA_FLEET_DOMAIN:-}
      TESLA_FLEET_REGION: ${TESLA_FLEET_REGION:-na}
      TESLA_VIN: ${TESLA_VIN:-}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:-http://localhost:4381/callback}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GUEST_WIFI_SSID: ${GUEST_WIFI_SSID:-}
      GUEST_WIFI_PASSWORD: ${GUEST_WIFI_PASSWORD:-}
      GUEST_WIFI_SECURITY: ${GUEST_WIFI_SECURITY:-}
      GUEST_WIFI_HIDDEN: ${GUEST_WIFI_HIDDEN:-}
      GUEST_PHOTOBOOTH_URL: ${GUEST_PHOTOBOOTH_URL:-}
      GUEST_PHOTOBOOTH_DISPLAY_SECONDS: ${GUEST_PHOTOBOOTH_DISPLAY_SECONDS:-}
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      # So loadDotEnv / guest-photobooth can read newly edited secrets after a
      # process restart (compose env_file alone only injects at container create).
      - ./.env:/app/.env:ro
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
