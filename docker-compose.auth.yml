# One-off Amazon login proxy on the NAS (host networking — no Docker port maps).
#
# Usage:
#   PROXY_OWN_IP=192.168.1.10 ./reauth.sh
#
# Or manually:
#   docker compose stop signal-bridge
#   docker rm -f signal-alexa-auth
#   PROXY_OWN_IP=192.168.1.10 docker compose -p signal-auth -f docker-compose.auth.yml up
services:
  signal-alexa-auth:
    image: signal-bridge:latest
    container_name: signal-alexa-auth
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      AMAZON_PAGE: ${AMAZON_PAGE:-amazon.com}
      ACCEPT_LANGUAGE: ${ACCEPT_LANGUAGE:-en-US}
      PROXY_OWN_IP: ${PROXY_OWN_IP:?Set PROXY_OWN_IP to your NAS LAN IP}
      PROXY_PORT: ${PROXY_PORT:-3456}
      DEBUG: ${DEBUG:-0}
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
    command: ["npm", "run", "auth"]
